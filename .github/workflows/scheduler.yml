name: Daily GOV.UK Timestamp Tracker

on:
  schedule:
    - cron: "50 9 * * *"  # runs every day at 09:50 UTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2

      - name: Install required R packages
        run: |
          Rscript -e 'install.packages(c("httr2", "rvest", "lubridate"), repos="https://cloud.r-project.org")'

      - name: Run tracker
        run: Rscript record_update.R

      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add smallboats_updates.csv
          git commit -m "Daily update $(date -u '+%Y-%m-%d')" || echo "No changes"
          git push
