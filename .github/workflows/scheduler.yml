name: Daily GOV.UK Timestamp Tracker

on:
  schedule:
    - cron: "00 9 * * *"  # Runs every day at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write 
  
jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install system-level dependencies only once
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      # Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # Cache R packages so we don't reinstall them every day
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('record_update.R') }}
          restore-keys: |
            ${{ runner.os }}-r-

      # Install only missing R packages (first run will install, later runs reuse cache)
      - name: Install required R packages
        run: |
          Rscript -e 'install.packages(c("httr2", "rvest", "lubridate"), repos="https://cloud.r-project.org")'

      # Run your tracker script
      - name: Run R script
        run: Rscript record_update.R

      # Commit results if there are any new updates
      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add smallboats_updates.csv
          git commit -m "Daily update $(date -u '+%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
