
name: Daily GOV.UK Timestamp Tracker

on:
  schedule:
    - cron: "7 * * * *"   # At minute 07 of every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install Linux system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libicu-dev \
            pkg-config

      # 3. Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      # 4. Install R packages
      - name: Install required R packages
        run: |
          Rscript -e 'install.packages(
            c("httr2", "xml2", "rvest", "lubridate", "dplyr", "stringr"),
            repos = "https://cloud.r-project.org"
          )'

      # 5. Test that all packages load correctly
      - name: Test R packages
        run: |
          Rscript -e 'library(httr2)'
          Rscript -e 'library(xml2)'
          Rscript -e 'library(rvest)'
          Rscript -e 'library(lubridate)'
          Rscript -e 'library(dplyr)'
          Rscript -e 'library(stringr)'
          Rscript -e 'sessionInfo()'

      # 6. Run your GOV.UK tracker
      - name: Run R script
        run: Rscript record_update.R

      # 7. Commit updated CSV file
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add smallboats_updates.csv

          git diff --cached --quiet || \
            git commit -m "Update GOV.UK arrivals data $(date -u '+%Y-%m-%d %H:%M:%S')"

          git push
