name: Daily GOV.UK Timestamp Tracker

on:
  schedule:
    - cron: "00 9 * * *"  # Runs every day at 09:00 UTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install required R packages
        run: |
          Rscript -e 'install.packages("httr2", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("rvest", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("lubridate", repos="https://cloud.r-project.org")'

      - name: Run R script
        run: Rscript record_update.R

      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add smallboats_updates.csv
          git commit -m "Daily update $(date -u '+%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
